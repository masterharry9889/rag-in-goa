dataset:
  hf_repo: "ai4bharat/MSMARCO-XI"
  split: "hi" # Hindi subset by default, supports multilingual passages
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  processed_filename: "msmarco_xi_cleaned.parquet"

chunking:
  # Options: fixed_size, recursive, semantic, metadata_aware
  default_strategy: "fixed_size"
  fixed_size:
    chunk_size_tokens: 2048
    overlap_pct: 0.30  # 30% overlap
  recursive:
    chunk_size_chars: 500
    chunk_overlap_chars: 100
  semantic:
    similarity_threshold: 0.65
    max_chunk_sentences: 6
  metadata_aware:
    align_to_passage: true

retrieval:
  # Fast, highly performant multilingual sentence encoder
  embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  device: "cpu"
  vector_db:
    persist_directory: "data/chroma_db"
    collection_name: "msmarco_xi_passages"
  hybrid_search:
    top_k: 3
    alpha_vector: 0.6
    beta_bm25: 0.4

stt:
  api_endpoint: "https://api.sarvam.ai/speech-to-text"
  model: "saaras:v3"
  mode: "transcribe"
  language_code: "hi-IN" # Default language code for Sarvam saaras:v3

generation:
  provider: "mistral"
  model: "mistral-small-latest"
  api_endpoint: "https://api.mistral.ai/v1/chat/completions"
  temperature: 0.1
  max_tokens: 150
  timeout_seconds: 15

guardrails:
  input_filter:
    enabled: true
    min_query_length: 2
    domain_centroid_threshold: 0.20
  groundedness_check:
    enabled: true
    overlap_threshold: 0.25
    similarity_threshold: 0.40

harness:
  max_retries: 3
  backoff_factor: 1.5

server:
  host: "0.0.0.0"
  port: 8000
